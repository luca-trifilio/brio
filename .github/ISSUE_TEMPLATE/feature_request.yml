name: Feature Request
description: Suggest a new feature or improvement
labels: ["type: feature", "status: needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Before opening a request, please search existing issues and discussions
        to avoid duplicates.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: >
        What problem does this feature solve?
        Concrete use cases are more helpful than abstract descriptions.
      placeholder: "When I try to do X, I can't because..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: >
        Describe the solution you'd like. Include keybindings, UI behaviour,
        or config format if relevant.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: >
        Any alternative approaches or workarounds you've already tried.

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Screenshots, mockups, links to similar features in other tools, etc.
