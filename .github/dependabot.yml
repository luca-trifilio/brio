version: 2
updates:
  # ── Go modules ──────────────────────────────────────────────────────────────
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: "Europe/Rome"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "area: dependencies"
    # Group all patch updates into a single PR to reduce noise
    groups:
      patch-updates:
        applies-to: version-updates
        update-types: ["patch"]

  # ── GitHub Actions ───────────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: "Europe/Rome"
    commit-message:
      prefix: "ci(deps)"
    labels:
      - "area: ci"
