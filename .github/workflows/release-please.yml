name: Release Please

# Triggered manually when you decide it's time to cut a release.
# Analyses conventional commits since the last release, opens (or updates)
# a "Release PR" that bumps .release-please-manifest.json and CHANGELOG.md.
# Merging that PR creates the tag, which triggers release.yml (GoReleaser).
#
# IMPORTANT: uses RELEASE_PLEASE_TOKEN (a PAT) — NOT GITHUB_TOKEN.
# If GITHUB_TOKEN were used, the tag it creates would NOT trigger release.yml,
# because GitHub silently ignores workflow events triggered by GITHUB_TOKEN.
# See: https://github.com/googleapis/release-please-action#workflow-permissions

on:
  workflow_dispatch:

permissions: read-all

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create tags & commits on the release PR
      pull-requests: write  # open/update the Release PR
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name:        ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          token:         ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file:   release-please-config.json
          manifest-file: .release-please-manifest.json
