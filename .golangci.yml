version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck      # unchecked function return values
    - govet         # correctness (shadow, printf format, composite literals, etc.)
    - staticcheck   # comprehensive analysis — SA, S1, QF and ST rule sets
    - ineffassign   # assignments whose value is never used
    - goimports     # import grouping and formatting
    - misspell      # typos in comments and string literals
    - unconvert     # unnecessary type conversions
    - bodyclose     # HTTP response body not closed
    - noctx         # HTTP requests constructed without a context
    - godot         # exported comments should end with a period
    - tenv          # use t.Setenv instead of os.Setenv in tests
    - nilerr        # mistakenly return nil instead of the error variable

  exclusions:
    rules:
      # Test files get a relaxed set — errcheck false-positives on t.Setenv etc.,
      # noctx is not meaningful in tests, godot is noisy on test helper comments.
      - path: _test\.go
        linters: [errcheck, noctx, godot]

linters-settings:
  goimports:
    local-prefixes: github.com/luca-trifilio/brio
  misspell:
    locale: US
  godot:
    scope: toplevel
    period: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
