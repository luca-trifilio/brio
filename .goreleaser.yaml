version: 2

project_name: brio

before:
  hooks:
    - go mod tidy

metadata:
  mod_timestamp: "{{ .CommitTimestamp }}"

builds:
  - id: brio
    main: ./
    binary: brio
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/luca-trifilio/brio/internal/cli.version={{.Version}}
      - -X github.com/luca-trifilio/brio/internal/cli.commit={{.ShortCommit}}
      - -X github.com/luca-trifilio/brio/internal/cli.date={{.Date}}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    format: tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "arm64" }}arm64
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# Keyless signing with cosign (GitHub OIDC — no long-lived key required).
# Requires: sigstore/cosign-installer in the workflow + id-token: write permission.
signs:
  - cmd: cosign
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "--yes"
      - "${artifact}"
    artifacts: checksum
    output: true

# SBOM per archive, generated by syft.
# Requires: anchore/sbom-action/download-syft in the workflow.
sboms:
  - artifacts: archive

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  # Credit contributors by their GitHub handle automatically.
  format: "{{ .SHA }}: {{ .Message }}{{ if .Logins }} ({{ .Logins | englishJoin }}){{ end }}"
  groups:
    - title: "🚀 Features"
      regexp: "^feat"
      order: 0
    - title: "🐛 Bug Fixes"
      regexp: "^fix"
      order: 1
    - title: "⚡ Performance"
      regexp: "^perf"
      order: 2
    - title: "♻️ Refactoring"
      regexp: "^refactor"
      order: 3
    - title: "📝 Documentation"
      regexp: "^docs"
      order: 4
    - title: "Other"
      order: 999
  filters:
    exclude:
      - "^chore"
      - "^test"
      - "^ci"
      - "^build"
      - "^style"
      - "merge conflict"
      - "Merge pull request"
      - "Merge remote-tracking branch"
      - "Merge branch"

release:
  github:
    owner: luca-trifilio
    name: brio
  draft: false
  prerelease: auto
  footer: |
    ## Install

    **Homebrew** (macOS / Linux)
    ```sh
    brew install luca-trifilio/brio/brio
    # upgrade an existing install:
    brew upgrade luca-trifilio/brio/brio
    ```

    **Go**
    ```sh
    go install github.com/luca-trifilio/brio@{{ .Tag }}
    ```

    **Verify the release signature** ([cosign](https://github.com/sigstore/cosign))
    ```sh
    cosign verify-blob \
      --signature   checksums.txt.sig \
      --certificate checksums.txt.pem \
      --certificate-identity-regexp "https://github.com/luca-trifilio/brio" \
      --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
      checksums.txt
    ```

    ---
    **Full Changelog**: https://github.com/luca-trifilio/brio/blob/main/CHANGELOG.md

brews:
  - name: brio
    repository:
      owner: luca-trifilio
      name: homebrew-brio
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "Brew formula update for brio {{ .Tag }}"
    directory: Formula
    homepage: "https://github.com/luca-trifilio/brio"
    description: "A vim-style TUI for Bruno API collections"
    license: "MIT"
    install: |
      bin.install "brio"
    test: |
      system "#{bin}/brio", "--version"
