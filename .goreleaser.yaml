version: 2

project_name: bruno-tui

before:
  hooks:
    - go mod tidy

builds:
  - id: bruno-tui
    main: ./
    binary: bruno-tui
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/luca-trifilio/bruno-tui/internal/cli.version={{.Version}}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: linux
        goarch: arm64

archives:
  - id: default
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - 'merge conflict'
      - Merge pull request
      - Merge remote-tracking branch
      - Merge branch

release:
  github:
    owner: luca-trifilio
    name: bruno-tui
  draft: false
  prerelease: auto

brews:
  - name: bruno-tui
    repository:
      owner: luca-trifilio
      name: homebrew-bruno-tui
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "Update bruno-tui formula to {{ .Tag }}"
    homepage: "https://github.com/luca-trifilio/bruno-tui"
    description: "A vim-style TUI for Bruno API collections"
    license: "MIT"
    install: |
      bin.install "bruno-tui"
    test: |
      system "#{bin}/bruno-tui", "--version"
