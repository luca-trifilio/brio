pre-commit:
  parallel: true
  commands:
    fmt:
      glob: "*.go"
      run: gofmt -l {staged_files} | grep . && exit 1 || true
      fail_text: "Run 'make fmt' to fix formatting"

    vet:
      glob: "*.go"
      run: go vet ./...
      fail_text: "Run 'make vet' to see details"

    lint:
      glob: "*.go"
      run: golangci-lint run ./...
      fail_text: "Run 'make lint' to see details"

pre-push:
  commands:
    test:
      run: go test -race ./...
      fail_text: "Run 'make test' to see details"
